<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="importmap">
        {
            "imports": {
                "dayjs": "https://cdn.skypack.dev/dayjs@1.11.5"
            }
        }
    </script>
    <script type="module" src="./get-data.js" defer ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Reddit+Mono:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <title>UWSO Scraper</title>
</head>
<body>
    <header>
        <h1>UWSO Scraper</h1>
    </header>
    <div class="container">
        <form action="" id="search-form">
            <div class="option-bar grid">
                <div class="option-bar-input">
                    <label for="start-date">Start date</label>
                    <input type="date" name="start-date" id="start-date">
                </div>
                <div class="option-bar-input">
                    <label for="end-date">End date</label>
                    <input type="date" name="end-date" id="end-date">
                </div>
                <div class="option-bar-input select-input">
                    <label for="station">Station</label>
                    <select name="station" id="station">
                        <option value="SBSN">SBSN - SANTAREM INTL ARPT, Brazil</option>
                    </select>
                </div>
                <div class="option-bar-input submit">
                    <input type="submit" value="Get results">
                </div>
            </div>
        </form>
    </div>
    <div id="results" class="container">
        <textarea name="results-display" id="results-display" readonly></textarea>
    </div>
    
    <script>
        const today = new Date().toISOString().split("T")[0];

        document.getElementById('start-date').setAttribute('max', today);
        document.getElementById('end-date').setAttribute('max', today);
    </script>
</body>
</html>
