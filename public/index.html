<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="importmap">
        {
            "imports": {
                "dayjs": "https://cdn.skypack.dev/dayjs@1.11.5"
            }
        }
    </script>
    <script type="module" src="./get-data.js" defer ></script>
    <title>UWSO Scraper</title>
</head>
<body>
    <header>
        <h1>UWSO Scraper</h1>
    </header>
    <form action="" id="search-form">
        <div class="option-bar">
            <label for="start-date">Start date</label>
            <input type="date" name="start-date" id="start-date">
            <label for="end-date">End date</label>
            <input type="date" name="end-date" id="end-date">
            <label for="station">Station</label>
            <select name="station" id="station">
                <option value="SBSN">SBSN - SANTAREM INTL ARPT, Brazil</option>
            </select>
            <input type="submit" value="Get results">
        </div>
    </form>
    <div id="results">
        <textarea name="results-display" id="results-display"></textarea>
    </div>
    
    <script>
        const today = new Date().toISOString().split("T")[0];

        document.getElementById('start-date').setAttribute('max', today);
        document.getElementById('end-date').setAttribute('max', today);
    </script>
</body>
</html>
